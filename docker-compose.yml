# Dev: chỉ hạ tầng. Backend chạy bằng ./mvnw, frontend bằng npm start.
services:
  postgres:                                 # cùng phiên bản chính với Supabase (Postgres 17)
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gfmaster
      POSTGRES_USER: ${DB_USER:-gfm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gfm}
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports: ["6379:6379"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-gfm}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-gfm}
    ports: ["5672:5672", "15672:15672"]   # UI: http://localhost:15672
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  mongo:                                    # chỉ chạy khi: docker compose --profile mongo up
    image: mongo:8
    profiles: ["mongo"]
    ports: ["27017:27017"]
    volumes: [mongo:/data/db]

  # Storage S3-compatible để thử STORAGE_DRIVER=s3 trên máy (cùng API với Cloudflare R2 / AWS S3).
  # Chỉ chạy khi: docker compose --profile s3 up -d   · Console: http://localhost:9001
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gfm-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-gfm-minio-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Tạo 2 bucket một lần rồi thoát: gfm-public (ai cũng đọc được) và gfm-incoming (riêng tư, tự xoá sau 1 ngày)
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_USER}" "$${MINIO_PASSWORD}" &&
        mc mb --ignore-existing local/gfm-public local/gfm-incoming &&
        mc anonymous set download local/gfm-public &&
        (mc ilm rule add --expire-days 1 local/gfm-incoming || true)
    environment:
      MINIO_USER: ${S3_ACCESS_KEY:-gfm-minio}
      MINIO_PASSWORD: ${S3_SECRET_KEY:-gfm-minio-secret}

volumes: { postgres: {}, redis: {}, rabbitmq: {}, mongo: {}, minio: {} }
