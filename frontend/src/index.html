<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>HANOIVIBE · Hẹn ở đâu cũng đẹp</title>
    <base href="/" />
    <!-- viewport-fit=cover: dùng được vùng tai thỏ / thanh home (env(safe-area-inset-*)); interactive-widget: bàn phím ảo co trang thay vì che -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#6d4fd6" />
    <!-- Chế độ Tối: đọc lựa chọn đã lưu và gắn lớp dark ngay lúc đọc HTML, trước khi Angular chạy, để không nháy sáng → tối -->
    <script>
      try {
        if (localStorage.getItem('gfm.theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').content = '#0b0a12';
        }
      } catch (e) {}
    </script>
    <meta name="application-name" content="HANOIVIBE" />
    <meta name="apple-mobile-web-app-title" content="HANOIVIBE" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Font tự host (xem styles.scss): nạp trước bản thường và đậm, latin + tiếng Việt; các cỡ khác tải khi cần -->
    <link rel="preload" href="fonts/bvp-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bvp-400-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bvp-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/bvp-700-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Ảnh banner của các trang đầu (Khám phá quán, Tìm chỗ chơi, My place): tải ngay từ lúc đọc HTML, không chờ JS -->
    <link
      rel="preload"
      as="image"
      imagesrcset="banner/ho-guom-dem-900.webp 900w, banner/ho-guom-dem.webp 1920w"
      imagesizes="(min-width: 64rem) calc(100vw - 16rem), 100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
