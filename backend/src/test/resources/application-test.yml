management.endpoint.health.show-details: always

gfm:
  storage.local-dir: ${java.io.tmpdir}/gfm-test-uploads
  storage.local-incoming-dir: ${java.io.tmpdir}/gfm-test-uploads-incoming
  rate-limit:
    auth-per-minute: 5
    api-per-minute: 1000            # test gọi API dày đặc, không muốn dính giới hạn
  jwt:
    secret: test-secret-0123456789abcdef-0123456789abcdef
  # Overpass giả do CatalogImportIT dựng trên cổng cố định (không đổi property theo test, để
  # không tạo thêm Spring context và bộ container thứ hai)
  catalog:
    overpass-urls: [http://localhost:18765/api/interpreter]
    request-timeout: 5s
    delay-between-cells: 0s
    retry-delay: 0s
