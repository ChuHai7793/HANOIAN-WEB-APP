spring:
  flyway:
    # Dev nạp thêm dữ liệu mẫu (R__demo_data.sql)
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    properties.hibernate.format_sql: true

logging.level:
  org.hibernate.SQL: debug

management.endpoint.health.show-details: always

gfm:
  auth.cookie-secure: false         # dev chạy http://localhost
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
  # Ảnh cho dữ liệu mẫu (SeedAssetLoader), đường dẫn tính từ thư mục chạy backend
  seed.assets-dir: ${SEED_ASSETS_DIR:./seed-assets}
