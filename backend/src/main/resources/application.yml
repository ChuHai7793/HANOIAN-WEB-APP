spring:
  application.name: gf-master
  threads.virtual.enabled: true

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gfmaster}
    username: ${DB_USER:gfm}
    password: ${DB_PASSWORD:gfm}
    hikari.maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate:
      jdbc.batch_size: 50
      jdbc.time_zone: UTC
      order_inserts: true
      order_updates: true
      # DATETIME(6) trong DB ↔ Instant (không dùng kiểu timestamp_utc riêng của Hibernate)
      type.preferred_instant_jdbc_type: TIMESTAMP
      # Truyền thẳng LocalDate/LocalTime xuống driver, không quy đổi qua java.sql.Time + Calendar.
      # Nếu không, jdbc.time_zone=UTC làm giờ mở cửa lệch theo múi giờ của JVM (08:00 → 16:00 ở UTC+8).
      type.java_time_use_direct_jdbc: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false

  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:gfm}
    password: ${RABBIT_PASSWORD:gfm}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener.simple:
      prefetch: 10
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1s
        multiplier: 2

  cache.type: redis

  servlet.multipart:
    max-file-size: 12MB
    max-request-size: 13MB

  jackson:
    deserialization.fail-on-unknown-properties: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    show-details: never

springdoc:
  api-docs.path: /api/docs/openapi.json
  swagger-ui.path: /api/docs

gfm:
  jwt:
    secret: ${JWT_SECRET:}          # >= 32 byte, bắt buộc; app không khởi động nếu thiếu
    access-ttl: 15m
    refresh-ttl: 30d
  auth:
    cookie-secure: true
  rate-limit:
    auth-per-minute: 5              # login/register theo IP
    api-per-minute: 100             # mọi API khác theo user
    maps-per-minute: 20             # /maps/resolve theo user (mỗi lần có thể gọi ra Google)
  idempotency:
    ttl: 24h                        # POST cùng Idempotency-Key trong 24h nhận lại response cũ
    in-progress-ttl: 5m             # app chết giữa chừng thì khoá "đang xử lý" tự nhả sau 5 phút
  # Origin được phép gọi API (CORS) và gọi /auth/refresh, /auth/logout bằng cookie
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  storage:
    driver: ${STORAGE_DRIVER:local} # local | s3
    local-dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${PUBLIC_UPLOAD_BASE_URL:/uploads}
    s3:
      endpoint: ${S3_ENDPOINT:}
      bucket: ${S3_BUCKET:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  messaging.enabled: true
  jobs:
    orphan-uploads:
      cron: "0 0 3 * * *"           # 03:00 hằng ngày
      older-than: 7d                # chừa thời gian cho form đang mở dở
  mongo.enabled: false
