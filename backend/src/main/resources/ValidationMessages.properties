# Thông báo lỗi kiểm tra dữ liệu (Bean Validation) bằng tiếng Việt, thay câu tiếng Anh mặc định của
# Hibernate Validator (không có bản tiếng Việt). Frontend ghép với nhãn trường: "Ghi chú giờ, giá: tối đa 1000 ký tự".
# Ràng buộc trên danh sách (vd. tối đa 6 ảnh) tự ghi message riêng, vì {max} ở đây hiểu là số ký tự.
jakarta.validation.constraints.NotBlank.message=không được để trống
jakarta.validation.constraints.NotEmpty.message=không được để trống
jakarta.validation.constraints.NotNull.message=bắt buộc phải có
# EL mặc định của Hibernate Validator cấm gọi hàm (.concat), nên ghép bằng nhiều biểu thức ?: liền nhau
jakarta.validation.constraints.Size.message=${min == 0 ? 'tối đa' : 'từ'}${min == 0 ? '' : ' '}${min == 0 ? '' : min}${min == 0 ? '' : ' đến'} {max} ký tự
jakarta.validation.constraints.Min.message=nhỏ nhất là {value}
jakarta.validation.constraints.Max.message=lớn nhất là {value}
jakarta.validation.constraints.DecimalMin.message=nhỏ nhất là {value}
jakarta.validation.constraints.DecimalMax.message=lớn nhất là {value}
jakarta.validation.constraints.Positive.message=phải lớn hơn 0
jakarta.validation.constraints.Email.message=email không hợp lệ
jakarta.validation.constraints.Pattern.message=sai định dạng
